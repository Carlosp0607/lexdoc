# Ruta: .github/workflows/pruebas.yml
# Corre la suite de pytest contra un PostgreSQL real en cada push y pull request.
name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lexdoc_pruebas
          POSTGRES_USER: lexdoc
          POSTGRES_PASSWORD: lexdoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lexdoc -d lexdoc_pruebas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://lexdoc:lexdoc@localhost:5432/lexdoc_pruebas
      SECRET_KEY: clave-solo-para-pruebas

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr pruebas
        run: pytest -v
