{% extends 'base_app.html' %}
{#- Ruta: templates/superadmin/perfil.html -#}
{% block titulo %}Mi perfil{% endblock %}
{% block encabezado %}Mi perfil{% endblock %}
{% block bajada %}<p class="bajada">Administrador</p>{% endblock %}

{% block contenido %}
<form method="POST" class="panel formulario formulario-angosto bloque">
    {{ ui.csrf() }}
    <div class="campo">
        <label for="nombre">Nombre</label>
        <input type="text" name="nombre" id="nombre" value="{{ admin['nombre'] }}" required>
    </div>
    <div class="campo">
        <label for="email">Correo electrónico</label>
        <input type="email" name="email" id="email" value="{{ admin['email'] }}" required>
    </div>
    <div class="botones-formulario">
        <a class="boton" href="{{ url_for('superadmin_dashboard') }}">Cancelar</a>
        <button type="submit" class="boton boton-principal">Guardar cambios</button>
    </div>
</form>
<p><a href="{{ url_for('cambiar_password') }}">Cambiar contraseña</a></p>
{% endblock %}
